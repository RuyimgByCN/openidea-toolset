id = "ruyimg.toolset"
name = "Toolset"
version = "0.6.0"
description = "All-in-one developer toolset aligned with IntelliJ Toolset (55 tools): 27-category searchable command cheatsheets (270+ commands), Blockchain HD wallet + EVM ABI & live JSON-RPC API Explorer (net:ask), Stack Trace & NDJSON Log Analyzer, Glob & .gitignore Tester, .env/Properties/YAML Config Diff, Protobuf/gRPC Wire Decoder, SVG Optimizer & JSX Studio, Drag & Drop Image/QR converter, Regex Regulex railroad diagram, XPath & CSS Selector tester, JSON Repair/Flatten/Diff/Tree, Batch Template Expander, Symbol/Emoji & Unicode Inspector, CSS & Unit Converter, Hex Viewer, UA & HTTP Security Headers, SemVer, WebSocket, TOTP, X.509, Barcodes, Mock Data, CSV/Table, SQL, Markdown, crypto, IDs, Cron, FIGlet, HTTP/cURL, Hosts, notes, and Pomodoro."
authors = ["ruyimg"]
homepage = "https://github.com/RuyimgByCN/openidea-toolset"
license = "Apache-2.0"
change-notes = "0.6.0 — IDEA Toolset 2026.4.1 parity expansion (50 -> 55 tools + 4 major upgrades): (1) Unified Developer Cheatsheets expanded to 27 bilingual categories (270 commands) with global cross-category search & filter dropdown; (2) Blockchain tab upgraded with Offline EVM ABI selector/calldata encoder & Live JSON-RPC API Explorer (net:ask); (3) Image Converter & QR Code upgraded with SVG/Drag-and-Drop/Zoomable Scroll Preview & safe SVG rendering; (4) 5 new tools: Stack Trace & NDJSON Log Analyzer, Glob & .gitignore Tester, .env/Properties/YAML Config Diff (memory-only & masked), Schema-less Protobuf/gRPC Wire Decoder, and SVG Optimizer & React JSX Studio. 0.5.0 — Expand IDEA Toolset parity from 43 to 50 tools + 3 signature upgrades: Regulex-style Regex Railroad Diagram SVG & EN/ZH explainer; JSON Tree inline count hints, Expand/Collapse All, search filter & copy-JSONPath; 6 new String/Line ops; 7 new tools (Symbols/Emojis, Unit Converter, XPath/CSS, Hex Viewer, Template Expander, UA/HTTP Headers, SemVer). 0.4.2 — Preserve string literals, escapes, dollar quotes, and line-comment newlines in lexical SQL & CSS minifiers/formatters; keep secrets strictly in memory with upgrade scrubbing."
categories = ["tools"]
icon = "icons/toolset.svg"
icon-dark = "icons/toolset_dark.svg"
engines.openidea = "^1.14"
wasm = "dist/plugin.wasm"
activation = ["on-view:toolset", "on-command:*", "on-event:websocket-ready"]

[capabilities]
required = ["editor.read", "editor.write", "clipboard", "storage", "events"]
optional = ["clipboard.read", "net:ask"]

[[contributes.views]]
id = "toolset"
title = "Toolset"
icon = "icons/toolset.svg"
location = "right"
secondary = true
web = "web/index.html"
header = "none"

[[contributes.searchCategories]]
id = "tools"
title = "Toolset"

[[contributes.statusBar]]
id = "toolset"
text = "Toolset"
tooltip = "Toolset — Developer Utilities"
command = "open"
align = "right"
priority = 100

[contributes.settings]
title = "Toolset"
schema = "settings.schema.json"

